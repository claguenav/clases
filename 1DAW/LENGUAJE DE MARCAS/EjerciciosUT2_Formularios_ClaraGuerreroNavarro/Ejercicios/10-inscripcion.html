<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 10. Formulario completo de inscripcion</title>
</head>
<body>
  <h1>Formulario completo de inscripción</h1>

  <form action="" method="get">

    <input type="hidden" name="taller" value="lectura_2026">
    <fieldset>
      <legend>Datos personales</legend>

      <p>
        <label for="nombre">Nombre</label><br>
        <input type="text" id="nombre" name="nombre" autocomplete="name" required>
      </p>

      <p>
        <label for="correo">Correo electrónico</label><br>
        <input type="email" id="correo" name="correo" autocomplete="email" required>
      </p>

      <p>
        <label for="edad">Edad</label><br>
        <input type="number" id="edad" name="edad" min="1" max="120">
      </p>

      <p>
        <label for="poblacion">Población</label><br>
        <input type="text" id="poblacion" name="poblacion">
      </p>
    </fieldset>

    <fieldset>
      <legend>Preferencias</legend>
      <p>
        Turno:
        <label><input type="radio" name="turno" value="manana"> Mañana</label>
        <label><input type="radio" name="turno" value="tarde"> Tarde</label>
      </p>

      <p>
        Aficiones:
        <label><input type="checkbox" name="aficiones" value="deporte"> Deporte</label>
        <label><input type="checkbox" name="aficiones" value="lectura"> Lectura</label>
        <label><input type="checkbox" name="aficiones" value="cine"> Cine</label>
      </p>

      <p>
        <label for="comentario">Comentario (opcional)</label><br>
        <textarea id="comentario" name="comentario" maxlength="200" rows="3"></textarea>
      </p>

      <p>
        <label>
          <input type="checkbox" name="normas" required> He leído las normas
        </label>
      </p>
    </fieldset>
    <p>
      <label for="codigo_actividad">Código de actividad</label><br>
      <input type="text" id="codigo_actividad" name="codigo_actividad"
             pattern="[A-Z]{3}[0-9]{2}"
             aria-describedby="ayuda-codigo" required>
      <br>
      <small id="ayuda-codigo">Escribe tres letras de A a Z y dos cifras, por ejemplo LEC24.</small>
    </p>
    <p>
      <label for="codigo_asignado">Código asignado</label><br>
      <input type="text" id="codigo_asignado" name="codigo_asignado" value="LEC-01" readonly>
    </p>
    <p>
      <input type="submit" value="Enviar">
    </p>

  </form>
</body>
</html>
