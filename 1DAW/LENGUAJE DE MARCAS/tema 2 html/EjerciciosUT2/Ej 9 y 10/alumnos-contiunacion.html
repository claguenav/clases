<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continuacion del formulario</title>
  <style>
    fieldset {
      background-color: #f1b9e8;
    }

    legend {
      background-color: rgb(184, 172, 172);
      color: white;
      padding: 5px 10px;
    }

    input {
      margin: 5px;
    }

  </style>
</head>

<body>

  <h1 style="text-align: center;">DATOS DE ALUMNOS- CONTINUACIÓN</h1>
  <fieldset>
    <form action="/" method="get">
      <h2 style="text-align: center; color: red;">Teclea más datos.</h2>
      <h3>Teclea fecha de nacimiento:</h3>
      <label for="dia">Teclea dia de nacimiento:</label>
      <input type="number" name="dia" required>
      <label for="mes">Selecciona mes de nacimiento:</label>
      <input type="month" name="mes" required>
      <label for="año">Teclea el año de nacimiento:</label>
      <input type="number" name="año" required>
      <label for="curso">Selecciona el curso</label>
      <select name="curso" id="curso" required>
        <option value="SMR">Primero SMR</option>
        <option value="SMR">Segundo SMR</option>
        <option value="DAW">Primero DAW</option>
        <option value="DAW">Segundo DAW</option>
        <option value="ASIR">Primero ASIR</option>
        <option value="ASIR">Segundo ASIR</option>
      </select>
      <hr>
      <label for="optativas">Elige 3 materias optativas:</label>
      <input type="checkbox" name="check1" id="check1">Ingles
      <input type="checkbox" name="check2" id="check2">Frances
      <input type="checkbox" name="check3" id="check3">Deporte
      <input type="checkbox" name="check4" id="check4">Astronomia
      <input type="checkbox" name="check5" id="check5">Historia
      <input type="checkbox" name="check6" id="check6">Paginas web
      <input type="checkbox" name="check7" id="check7">Redes
      <hr>
      <label for="turno">Selecciona el turno:</label>
      <input type="radio" name="turno" value="vespertino" required> Vespertino
      <input type="radio" name="turno" value="diurno" required> Diurno
      <input type="radio" name="turno" value="Nocturno" required> Nocturno
      <hr>

      <button type="submit">Enviar datos</button>
      <button type="reset">Limpiar datos</button>
      <button type="button">
        <a href="../Ej 9 y 10/alumnos.html">Anterior formulario</a>
      </button>


    </form>
  </fieldset>
</body>
</html>
