<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fusión de columnas</title>
  <style>
    table {
      border-collapse: collapse;
    }

    th,
    td {
      text-align: center;
      background-color: rgb(190, 213, 255);
      border: 3px solid #8880ff;
      padding: 0.5rem;

    }


  </style>
</head>
<body>

<table>
  <tr>
    <td colspan="3">A</td>
    <td>B</td>
  </tr>
  <tr>
    <td>C</td>
    <td colspan="2">D</td>
    <td>E</td>
  </tr>
  <tr>
    <td colspan="4">F</td>
  </tr>
  <tr>
    <td>G</td>
    <td>H</td>
    <td>I</td>
    <td>J</td>
  </tr>
</table>

</body>
</html>
