<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de datos del alumnado</title>
  <style>
    fieldset {
      background-color: #9ed0fa;
    }

    legend {
      background-color: rgb(184, 172, 172);
      color: white;
      padding: 5px 10px;
    }

    input {
      margin: 5px;
    }
    .myDiv {
  border: 5px outset red;
  background-color: lightblue;
  text-align: center;
}

  </style>
</head>

<body>
  <h1 style="text-align: center;">DATOS DEL ALUMNADO</h1>
  <fieldset>
    <form action="/" method="get">
      <h2 style="text-align: center; color: red;">Teclea datos de entrada.</h2>
      <p>
        <label for="nombre">Teclea el nombre del alumno:</label>
        <input type="text" name="nombre" required>
      </p>
      <p>
        <label for="matricula">Teclea el numero de matricula:</label>
        <input type="number" name="matricula" required>
      </p>
      <p>
        <label for="direccion">Teclea la direccion:</label>
        <input type="text" name="direccion" required>
      </p>
      <p>
        <label for="poblacion">Teclea la poblacion:</label>
        <input type="text" name="poblacion" required>
      </p>
      <p>
        <label for="telefono">Teclea el telefono:</label>
        <input type="number" name="telefono">
      </p>
      <p>
        <label for="sexo">Selecciona el sexo:</label>
        <input type="radio" name="sexo1" value="h" required> Hombre
        <input type="radio" name="sexo2" value="m" required> Mujer
      </p>

      <hr>


      <button type="submit">Enviar datos</button>
      <button type="reset">Limpiar datos</button>
      <button type="button">
        <a href="../Ej 9 y 10/alumnos-contiunacion.html">Siguiente formulario</a>
      </button>

    </form>
  </fieldset>
</body>
</html>
