<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centro Pokémon</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <h1>Centro Pokémon</h1>
  <nav>
    <a href="#horario">Horario</a>
    <span><a href="#inscripcion">Inscripción</a></span>
  </nav>
  <main>
    <section id="horario">
      <h2>Horario</h2>
      <p class="aviso">Trae agua al entrenamiento.</p>
      <ul>
        <li>10:00 · Iniciación</li>
        <li>12:00 · Entrenamiento</li>
      </ul>
      <p>El circuito abre a las 09:30.</p>
    </section>
    <section id="inscripcion">
      <h2>Inscripción</h2>
      <p class="aviso">Las plazas son limitadas.</p>
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre">
    </section>
  </main>
  <footer><a href="mailto:centro@example.org">Contacto</a></footer>
</body>
</html>
